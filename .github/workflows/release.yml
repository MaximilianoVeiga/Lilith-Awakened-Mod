name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip.install --yes --no-progress
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path -LiteralPath $sevenZip)) {
            throw "7-Zip was not installed at $sevenZip"
          }
          echo "SEVEN_ZIP_EXE=$sevenZip" >> $env:GITHUB_ENV

      - name: Pack release packages
        shell: pwsh
        env:
          # Voice pack ships from Lilith-Awakened-Assets; pack CI only builds core + voice-runtime.
          # Models still come from Assets via VOICE_ASSETS_URL (needed inside voice-runtime.zip).
          VOICE_ASSETS_TAG: v1.0.0
          VOICE_ASSETS_URL: ${{ secrets.VOICE_ASSETS_URL }}
          VOICE_PACK_URL: ${{ secrets.VOICE_PACK_URL }}
          VOICE_MODELS_URL: ${{ secrets.VOICE_MODELS_URL }}
          RELEASE_ASSETS_URL: ${{ secrets.RELEASE_ASSETS_URL }}
          BEPINEX_ZIP_URL: ${{ secrets.BEPINEX_ZIP_URL }}
        run: |
          # Models-only for voice-runtime; installer voice pack comes from Assets release URL.
          if (-not $env:VOICE_MODELS_URL) {
            $env:VOICE_MODELS_URL = "https://github.com/MaximilianoVeiga/Lilith-Awakened-Assets/releases/download/v1.0.0/voice-models.zip"
          }
          ./scripts/pack-release-packages.ps1 `
            -SkipVoicePack `
            -PackagesDir packages `
            -CacheDir artifacts/cache `
            -ReleaseAssetsDir release-assets

      - name: Publish installer
        shell: pwsh
        run: |
          dotnet publish src/LilithModInstaller/LilithModInstaller.csproj `
            -c Release `
            -o artifacts/installer `
            --nologo

      - name: Generate release-manifest.json and SHA256SUMS.txt
        shell: pwsh
        run: |
          ./scripts/generate-release-artifacts.ps1 `
            -Version "${{ github.ref_name }}" `
            -Repository "${{ github.repository }}" `
            -InstallerPath "artifacts/installer/LilithAI-Mod-Setup.exe" `
            -PackagesDir "packages" `
            -OutputDir "artifacts/release" `
            -PackageConfig "release-packages.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/release/upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
